apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: keycloak
  namespace: cdip-auth
spec:
  healthCheck:
    type: HTTP
    requestPath: /auth/realms/master
    port: 8080
    checkIntervalSec: 5
    timeoutSec: 3
    healthyThreshold: 1
    unhealthyThreshold: 2
  connectionDraining:
    drainingTimeoutSec: 30
  # Attachment point for a Cloud Armor policy on the ingress backend; uncomment
  # once the policy exists in the project. LB health checks reach the NEG
  # directly and are not filtered by it.
  # securityPolicy:
  #   name: keycloak-master-lockdown
