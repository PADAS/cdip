apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: keycloak
  namespace: cdip-auth
spec:
  healthCheck:
    type: HTTP
    requestPath: /auth/realms/master
    port: 8080
    checkIntervalSec: 5
    timeoutSec: 3
    healthyThreshold: 1
    unhealthyThreshold: 2
  connectionDraining:
    drainingTimeoutSec: 30
