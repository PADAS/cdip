apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
    cloud.google.com/backend-config: '{"default": "keycloak"}'
  labels:
    app: keycloak
    app.version: "1"
  name: keycloak
  namespace: cdip-auth
spec:
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 8080
  selector:
    app: keycloak
  # ClusterIP: the GKE ingress reaches the pods through NEGs, so the Service
  # needs no load balancer or node ports of its own.
  type: ClusterIP
