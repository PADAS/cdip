# Only the two title strings change. Everything else inherits from the parent theme.
# loginAccountTitle is the login page h1 on Keycloak 26. Keycloak 11 has no such key and titles
# the page with doLogIn (also the button label), so kc11.css draws "Welcome" over it instead.
loginAccountTitle=Welcome
# <title> tag on both versions. Ignores the realm display name placeholder {0} on purpose.
# The same copy is the login-page subtitle in resources/css/gundi.css; change both together.
loginTitle=Sign in to Gundi
